<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ĐiĐâuĐó - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1&display=block" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background:
                radial-gradient(circle at top left, rgba(6, 182, 212, 0.14), transparent 26%),
                radial-gradient(circle at bottom right, rgba(192, 132, 252, 0.14), transparent 26%),
                linear-gradient(135deg, #050816, #0a1024);
            color: #e2e8f0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body.theme-light {
            background: #edf2f7;
            color: #0f172a;
        }

        body.theme-light .panel,
        body.theme-light .content-wrap,
        body.theme-light .field,
        body.theme-light .desktop-nav-rail,
        body.theme-light .loginModal,
        body.theme-light .signupModal {
            color: #0f172a;
        }

        body.theme-light .panel {
            background: rgba(255, 255, 255, 0.88);
            border-color: rgba(15, 23, 42, 0.08);
        }

        body.theme-light .panel .text-slate-300,
        body.theme-light .panel .text-slate-400,
        body.theme-light .panel .text-slate-500 {
            color: #334155 !important;
        }

        body.theme-light .panel .text-slate-300 {
            color: #1e293b !important;
        }

        body.theme-light .panel .text-slate-400 {
            color: #475569 !important;
        }

        body.theme-light .panel .text-slate-500 {
            color: #64748b !important;
        }

        body.theme-light .panel .text-white {
            color: #0f172a !important;
        }

        body.theme-light .field {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(15, 23, 42, 0.1);
            color: #0f172a;
        }

        body.theme-light .field::placeholder {
            color: #64748b;
        }

        .ui-checkbox-input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }

        .ui-checkbox {
            -webkit-appearance: none;
            appearance: none;
            width: 1rem;
            height: 1rem;
            border-radius: 0 !important;
            border: 1.5px solid rgba(148, 163, 184, 0.6);
            background: rgba(15, 23, 42, 0.72);
            display: inline-grid;
            place-items: center;
            cursor: pointer;
            transition: border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
            flex: 0 0 auto;
        }

        .ui-checkbox::before {
            content: '✓';
            color: #ffffff;
            font-size: 0.82rem;
            line-height: 1;
            font-weight: 900;
            transform: scale(0);
            transition: transform 140ms ease;
        }

        .ui-checkbox-input:checked + .ui-checkbox {
            border-color: #7c3aed !important;
            background: #7c3aed !important;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18) !important;
        }

        .ui-checkbox.checked {
            border-color: #7c3aed !important;
            background: #7c3aed !important;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18) !important;
        }

        .ui-checkbox-input:checked + .ui-checkbox::before {
            transform: scale(1) !important;
        }

        .ui-checkbox.checked::before {
            transform: scale(1) !important;
        }

        .ui-checkbox-input:focus-visible + .ui-checkbox {
            outline: 2px solid rgba(34, 211, 238, 0.7);
            outline-offset: 2px;
        }

        body.theme-light .ui-checkbox {
            border-color: rgba(71, 85, 105, 0.55);
            background: rgba(255, 255, 255, 0.92);
        }

        body.theme-light .ui-checkbox-input:checked + .ui-checkbox {
            border-color: #7c3aed !important;
            background: #7c3aed !important;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18) !important;
        }

        body.theme-light .primary-btn {
            color: #2e1065;
        }

        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-flex;
            vertical-align: middle;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'liga';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        [data-icon] {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.55rem;
            line-height: 1.1;
        }

        [data-icon]::before {
            content: attr(data-icon);
            font-family: 'Material Symbols Rounded';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 1.05em;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.2em;
            flex: 0 0 auto;
            vertical-align: middle;
            height: 1.2em;
        }

        [data-icon].icon-only {
            justify-content: center;
            gap: 0;
        }

        [data-icon].icon-only::before {
            font-size: 1.15em;
        }

        [data-icon].icon-large::before {
            font-size: 1.35em;
        }

        body.theme-light .desktop-nav-rail {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(241, 245, 249, 0.94));
            border-color: rgba(15, 23, 42, 0.08);
            color: #0f172a;
        }

        body.theme-light .desktop-nav-item,
        body.theme-light .desktop-nav-profile,
        body.theme-light .desktop-nav-toggle,
        body.theme-light .desktop-nav-lang,
        body.theme-light .desktop-nav-auth-btn,
        body.theme-light .language-select,
        body.theme-light .desktop-nav-label,
        body.theme-light .desktop-nav-item-label,
        body.theme-light .desktop-nav-kicker,
        body.theme-light .desktop-nav-title,
        body.theme-light .desktop-nav-subtitle {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(15, 23, 42, 0.1);
        }

        body.theme-light .desktop-nav-label,
        body.theme-light .desktop-nav-item-label,
        body.theme-light .desktop-nav-kicker,
        body.theme-light .desktop-nav-title,
        body.theme-light .desktop-nav-subtitle,
        body.theme-light .desktop-nav-copy,
        body.theme-light .desktop-nav-profile,
        body.theme-light .desktop-nav-item,
        body.theme-light .desktop-nav-toggle,
        body.theme-light .desktop-nav-auth-btn,
        body.theme-light .desktop-nav-lang,
        body.theme-light .desktop-nav-theme-btn {
            color: #0f172a !important;
        }

        body.theme-light .desktop-nav-rail [data-icon]::before,
        body.theme-light .desktop-nav-rail .material-symbols-rounded {
            color: #334155;
        }

        body.theme-light .desktop-nav-item:hover [data-icon]::before,
        body.theme-light .desktop-nav-profile:hover [data-icon]::before,
        body.theme-light .desktop-nav-toggle:hover [data-icon]::before,
        body.theme-light .desktop-nav-auth-btn:hover [data-icon]::before,
        body.theme-light .desktop-nav-item:hover .material-symbols-rounded,
        body.theme-light .desktop-nav-profile:hover .material-symbols-rounded,
        body.theme-light .desktop-nav-toggle:hover .material-symbols-rounded,
        body.theme-light .desktop-nav-auth-btn:hover .material-symbols-rounded {
            color: #0f172a;
        }

        body.theme-light .desktop-nav-item:hover,
        body.theme-light .desktop-nav-profile:hover,
        body.theme-light .desktop-nav-toggle:hover,
        body.theme-light .desktop-nav-auth-btn:hover {
            background: rgba(15, 23, 42, 0.06);
        }

        body.theme-light .desktop-nav-lang:hover,
        body.theme-light .desktop-nav-theme-btn:hover,
        body.theme-light .desktop-nav-auth-btn:hover {
            color: #020617;
        }

        .desktop-nav-rail {
            width: 250px;
            min-width: 250px;
            max-width: 250px;
            transition: width 0.25s ease, min-width 0.25s ease, max-width 0.25s ease, transform 0.25s ease;
            background: rgba(15, 23, 42, 0.92);
            border-right: 1px solid rgba(192, 132, 252, 0.18);
            backdrop-filter: blur(14px);
            z-index: 20;
        }

        body.desktop-nav-collapsed .desktop-nav-rail {
            width: 92px;
            min-width: 92px;
            max-width: 92px;
        }

        .desktop-nav-shell {
            height: 100%;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .desktop-nav-top,
        .desktop-nav-middle,
        .desktop-nav-bottom {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .desktop-nav-top {
            flex: 0 0 auto;
        }

        .desktop-nav-middle {
            flex: 1 1 auto;
        }

        .desktop-nav-bottom {
            flex: 0 0 auto;
            margin-top: auto;
        }

        .desktop-nav-toggle {
            align-self: flex-end;
            width: 34px;
            height: 34px;
            border-radius: 9999px;
            border: 1px solid rgba(192, 132, 252, 0.28);
            background: rgba(15, 23, 42, 0.75);
            color: #e2e8f0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .desktop-nav-toggle:hover {
            background: rgba(192, 132, 252, 0.22);
            transform: translateY(-1px);
        }

        .desktop-nav-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            border-radius: 18px;
            border: 1px solid rgba(192, 132, 252, 0.16);
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
            text-align: left;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .desktop-nav-profile:hover {
            background: rgba(192, 132, 252, 0.12);
            transform: translateY(-1px);
        }

        .desktop-nav-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
            flex: 0 0 auto;
        }

        .desktop-nav-copy {
            min-width: 0;
            flex: 1 1 auto;
        }

        .desktop-nav-kicker {
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(226, 232, 240, 0.58);
            margin-bottom: 2px;
        }

        .desktop-nav-title {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .desktop-nav-subtitle {
            font-size: 12px;
            color: rgba(226, 232, 240, 0.7);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .desktop-nav-collapsed .desktop-nav-copy,
        .desktop-nav-collapsed .desktop-nav-footer-text,
        .desktop-nav-collapsed .desktop-nav-label,
        .desktop-nav-collapsed .desktop-nav-status,
        .desktop-nav-collapsed .desktop-nav-auth-group,
        .desktop-nav-collapsed .desktop-nav-kicker,
        .desktop-nav-collapsed .desktop-nav-title,
        .desktop-nav-collapsed .desktop-nav-subtitle {
            display: none;
        }

        .desktop-nav-collapsed .desktop-nav-profile {
            justify-content: center;
            width: 56px;
            height: 56px;
            min-height: 56px;
            margin-inline: auto;
            padding: 0;
            border-radius: 50%;
            overflow: hidden;
        }

        .desktop-nav-collapsed .desktop-nav-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .desktop-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 48px;
            padding: 10px 12px;
            border-radius: 16px;
            border: 1px solid transparent;
            background: transparent;
            color: #e2e8f0;
            text-align: left;
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }

        .desktop-nav-item:hover,
        .desktop-nav-item.active {
            background: rgba(192, 132, 252, 0.12);
            border-color: rgba(192, 132, 252, 0.22);
        }

        .desktop-nav-item-icon {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex: 0 0 auto;
        }

        .desktop-nav-item-label {
            font-weight: 600;
            font-size: 14px;
            line-height: 1;
        }

        .desktop-nav-section-title {
            margin: 8px 2px 0;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(226, 232, 240, 0.52);
        }

        .desktop-nav-divider {
            height: 1px;
            background: rgba(148, 163, 184, 0.16);
            margin: 2px 0;
        }

        .desktop-nav-lang-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .desktop-nav-preferences-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .desktop-nav-label,
        .desktop-nav-footer-text {
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(226, 232, 240, 0.58);
        }

        .desktop-nav-lang,
        .desktop-nav-auth-btn {
            width: 100%;
            border-radius: 14px;
            border: 1px solid rgba(192, 132, 252, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
        }

        .desktop-nav-lang {
            padding: 10px 12px;
            font-size: 14px;
        }

        .desktop-nav-theme-row,
        .desktop-nav-auth-group {
            display: flex;
            gap: 8px;
        }

        .desktop-nav-theme-row button,
        .desktop-nav-auth-group button {
            flex: 1 1 auto;
        }

        .desktop-nav-theme-btn,
        .desktop-nav-auth-btn {
            min-height: 42px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .desktop-nav-language-toggle {
            justify-content: center;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .desktop-nav-auth-btn.login {
            border-color: rgba(192, 132, 252, 0.35);
            color: #c084fc;
        }

        .desktop-nav-auth-btn.logout {
            border-color: rgba(248, 113, 113, 0.55);
            color: #f87171;
            background: rgba(127, 29, 29, 0.22);
        }

        .desktop-nav-auth-btn.logout::before {
            color: #f87171;
        }

        .desktop-nav-collapsed .desktop-nav-preferences-wrap .desktop-nav-label {
            display: none;
        }

        .desktop-nav-collapsed .desktop-nav-theme-row,
        .desktop-nav-collapsed .desktop-nav-auth-group {
            flex-direction: column;
        }

        .desktop-nav-collapsed .desktop-nav-lang,
        .desktop-nav-collapsed .desktop-nav-theme-btn,
        .desktop-nav-collapsed .desktop-nav-auth-btn {
            justify-content: center;
            text-align: center;
        }

        .desktop-nav-collapsed .desktop-nav-text-only {
            display: none;
        }

        .desktop-nav-collapsed #desktopLanguageToggleBtn .desktop-nav-text-only {
            display: inline;
        }

        .desktop-nav-collapsed .desktop-nav-theme-btn,
        .desktop-nav-collapsed .desktop-nav-auth-btn {
            padding-inline: 0;
        }

        /* Keep auth group visible in collapsed state and ensure language toggle shows */
        .desktop-nav-collapsed .desktop-nav-auth-group {
            display: flex !important;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .desktop-nav-collapsed #desktopLanguageToggleBtn {
            display: inline-flex !important;
            justify-content: center;
            align-items: center;
        }

        /* Stronger red styling for logout in both collapsed and expanded states */
        .desktop-nav-auth-btn.logout,
        .desktop-nav-collapsed .desktop-nav-auth-btn.logout {
            color: #f87171 !important;
            border-color: rgba(248, 113, 113, 0.6) !important;
            background: rgba(127, 29, 29, 0.12) !important;
        }

        .desktop-nav-auth-btn.logout::before,
        .desktop-nav-collapsed .desktop-nav-auth-btn.logout::before {
            color: #f87171 !important;
        }

        /* Ensure logout remains highlighted in light theme */
        body.theme-light .desktop-nav-auth-btn.logout,
        body.theme-light .desktop-nav-collapsed .desktop-nav-auth-btn.logout {
            color: #b91c1c !important;
            border-color: rgba(220, 38, 38, 0.6) !important;
            background: rgba(220, 38, 38, 0.06) !important;
        }

        body.theme-light .desktop-nav-auth-btn.logout::before,
        body.theme-light .desktop-nav-collapsed .desktop-nav-auth-btn.logout::before {
            color: #b91c1c !important;
        }

        /* Simple native tooltip styling fallback for compact icons */
        .desktop-nav-rail button[title] {
            cursor: pointer;
        }

        .content-wrap {
            flex: 1;
            overflow: auto;
            padding: 24px;
        }

        .panel {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.4);
        }

        .field {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
            padding: 0.75rem 0.9rem;
            outline: none;
        }

        .field:focus {
            border-color: rgba(6, 182, 212, 0.55);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.12);
        }

        .primary-btn {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            color: #2e1065;
            font-weight: 800;
        }

        @media (max-width: 768px) {
            .desktop-nav-rail { display: none !important; }
            .content-wrap { padding: 14px; }
        }
    </style>
</head>
<body class="overflow-hidden">
    <div class="flex h-screen w-screen">
        <aside class="desktop-nav-rail hidden md:flex flex-col">
            <div class="desktop-nav-shell">
                <div class="desktop-nav-top">
                    <button id="desktopNavToggle" type="button" class="desktop-nav-toggle" aria-label="Collapse navigation">‹</button>
                    <button id="desktopProfileButton" type="button" class="desktop-nav-profile" aria-label="Open profile">
                        <img id="desktopUserAvatar" src="" alt="Profile picture" class="desktop-nav-avatar" />
                        <div class="desktop-nav-copy">
                            <div class="desktop-nav-kicker" data-i18n="profile">Profile</div>
                            <div id="desktopUserName" class="desktop-nav-title">Guest</div>
                            <div id="desktopUserStatus" class="desktop-nav-subtitle">Sign in to continue</div>
                        </div>
                    </button>
                </div>

                <div class="desktop-nav-middle">
                    <div class="desktop-nav-section-title">Main</div>
                    <button id="mapNavBtn" type="button" class="desktop-nav-item active" aria-label="Map" data-icon="map">
                        <span class="desktop-nav-item-label desktop-nav-label" data-i18n="map">Map</span>
                    </button>
                    <button id="friendsNavBtn" type="button" class="desktop-nav-item" aria-label="Friends" data-icon="group">
                        <span class="desktop-nav-item-label desktop-nav-label" data-i18n="friends">Friends</span>
                    </button>
                </div>

                <div class="desktop-nav-bottom">
                    <div class="desktop-nav-divider"></div>
                    <div class="desktop-nav-preferences-wrap">
                        <div class="desktop-nav-label" data-i18n="preferences">Preferences</div>
                        <button id="desktopLanguageToggleBtn" type="button" class="desktop-nav-auth-btn desktop-nav-language-toggle desktop-nav-lang" aria-label="Toggle language">
                            <span id="desktopLanguageToggleText" class="desktop-nav-text-only">EN</span>
                        </button>
                    </div>
                    <div class="desktop-nav-theme-row">
                        <button id="themeToggleBtn" type="button" class="desktop-nav-theme-btn desktop-nav-auth-btn" aria-label="Toggle theme" data-icon="dark_mode">
                            <span class="desktop-nav-label" data-i18n="theme">Theme</span>
                            <span id="themeToggleText" class="desktop-nav-text-only">Dark mode</span>
                        </button>
                    </div>
                    <div class="desktop-nav-divider"></div>
                    <div class="desktop-nav-footer-text" data-i18n="account">Account</div>
                    <div class="desktop-nav-auth-group">
                        <button id="desktopLoginBtn" type="button" class="desktop-nav-auth-btn login" data-icon="login"><span class="desktop-nav-text-only" data-i18n="login">Login</span></button>
                        <button id="desktopLogoutBtn" type="button" class="desktop-nav-auth-btn logout" data-icon="logout"><span class="desktop-nav-text-only" data-i18n="logout">Logout</span></button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="content-wrap">
            <div id="signedOutNotice" class="panel mb-6 rounded-2xl p-5">
                <p class="text-xs uppercase tracking-[0.24em] text-cyan-300/90">Sign in required</p>
                <h2 class="mt-2 text-2xl font-bold text-white">Use your profile and favorites</h2>
                <p class="mt-2 max-w-2xl text-sm text-slate-300">You need to sign in to manage profile data and favorite locations.</p>
                <div class="mt-4">
                    <button id="signedOutLoginBtn" class="primary-btn rounded-xl px-4 py-3 text-sm">Sign in</button>
                </div>
            </div>

            <div id="profileShell" class="grid gap-6 lg:grid-cols-[320px_minmax(0,1fr)]">
                <section class="panel rounded-3xl p-5">
                    <p class="text-xs uppercase tracking-[0.24em] text-cyan-300/90">Account</p>
                    <div id="profileSummary" class="mt-3 space-y-2">
                        <p class="text-slate-400">Loading profile...</p>
                    </div>
                </section>

                <section class="space-y-6">
                    <div class="panel rounded-3xl p-5">
                        <div class="flex items-center justify-between gap-3">
                            <div>
                                <p class="text-xs uppercase tracking-[0.24em] text-slate-400">Favorites</p>
                                <h3 class="mt-1 text-lg font-bold text-white">Favorite locations</h3>
                            </div>
                        </div>
                        <div id="favoritesList" class="mt-4 space-y-3"></div>
                    </div>

                    <div class="panel rounded-3xl p-5">
                        <div class="flex items-center justify-between gap-3">
                            <div>
                                <p class="text-xs uppercase tracking-[0.24em] text-slate-400">Ratings</p>
                                <h3 class="mt-1 text-lg font-bold text-white">Your rated places</h3>
                            </div>
                        </div>
                        <div id="ratingsList" class="mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-3"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="loginModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 px-4">
        <div class="panel w-full max-w-md rounded-3xl p-6">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <h2 class="text-2xl font-black text-white">Welcome</h2>
                    <p id="loginPrompt" class="mt-2 hidden rounded-xl border border-cyan-400/30 bg-cyan-950/30 px-3 py-2 text-sm text-cyan-100"></p>
                </div>
                <button id="loginModalClose" class="text-2xl leading-none text-slate-400 hover:text-white">×</button>
            </div>

            <div class="mt-5 flex gap-2 rounded-2xl border border-white/10 bg-slate-950/40 p-1">
                <button id="loginTabBtn" class="flex-1 rounded-xl bg-violet-500 px-3 py-2 text-sm font-bold text-slate-900">Login</button>
                <button id="signupTabBtn" class="flex-1 rounded-xl px-3 py-2 text-sm font-bold text-slate-400">Sign up</button>
            </div>

            <form id="loginForm" class="mt-5 space-y-4">
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-300">Email</label>
                    <input id="loginEmail" type="email" class="field" placeholder="your@email.com" required />
                </div>
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-300">Password</label>
                    <input id="loginPassword" type="password" class="field" placeholder="••••••••" required />
                </div>
                <div id="loginError" class="hidden text-sm text-red-300"></div>
                <button class="primary-btn w-full rounded-xl px-4 py-3 text-sm" type="submit">Login</button>
            </form>

            <form id="signupForm" class="mt-5 hidden space-y-4">
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-300">Email</label>
                    <input id="signupEmail" type="email" class="field" placeholder="your@email.com" required />
                </div>
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-300">Name</label>
                    <input id="signupName" type="text" class="field" placeholder="Your name" />
                </div>
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-300">Password</label>
                    <input id="signupPassword" type="password" class="field" placeholder="••••••••" required />
                </div>
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-300">Confirm password</label>
                    <input id="signupPasswordConfirm" type="password" class="field" placeholder="••••••••" required />
                </div>
                <div id="signupError" class="hidden text-sm text-red-300"></div>
                <button class="primary-btn w-full rounded-xl px-4 py-3 text-sm" type="submit">Create account</button>
            </form>
        </div>
    </div>

    <script src="./config.js"></script>
    <script src="./profile.js"></script>
</body>
</html>
